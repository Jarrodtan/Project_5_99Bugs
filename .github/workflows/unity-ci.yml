name: Unity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  PROJECT_PATH: EcoBalance3D

jobs:
  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      # Free runner disk is too small for the Unity 6 Docker image (~15 GB)
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-${{ hashFiles('EcoBalance3D/Assets/**', 'EcoBalance3D/Packages/**', 'EcoBalance3D/ProjectSettings/**') }}
          restore-keys: Library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      - name: Show Unity log and test results on failure
        if: failure()
        run: |
          echo "== files in artifacts =="; find artifacts -type f 2>/dev/null || true
          for f in $(find artifacts -name '*.log' 2>/dev/null); do echo "== $f (last 200 lines) =="; tail -n 200 "$f"; done
          for f in $(find artifacts -name '*.xml' 2>/dev/null); do echo "== $f =="; grep -E 'test-run|result="Failed"|<message>' "$f" | head -60; done
          for f in $(find "$PROJECT_PATH/Logs" -name '*.log' 2>/dev/null); do echo "== $f (last 100 lines) =="; tail -n 100 "$f"; done
          grep -rhE "error CS[0-9]+|License|licen[sc]e|activation" artifacts 2>/dev/null | sort -u | head -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts

  build:
    name: Build (Android)
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Free runner disk is too small for the Unity 6 Docker image (~15 GB)
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-Android-${{ hashFiles('EcoBalance3D/Assets/**', 'EcoBalance3D/Packages/**', 'EcoBalance3D/ProjectSettings/**') }}
          restore-keys: Library-Android-

      - uses: game-ci/unity-builder@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: Android
          buildName: EcoBalance

      - uses: actions/upload-artifact@v4
        with:
          name: EcoBalance-Android
          path: build/Android
# [AI-GENERATED END]
